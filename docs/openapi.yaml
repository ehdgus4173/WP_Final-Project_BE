openapi: 3.0.3
info:
  title: What's Today — Backend API
  version: "1.0.0"
  description: >
    AI가 매일 선정·관리자가 검수·게시한 단 하나의 시사 이슈에 대해 토론하는 포럼의 백엔드 API.
    모든 응답은 공통 envelope을 사용한다: 성공 `{ success: true, data }`, 실패 `{ success: false, error: { code, message } }`.
    인증은 JWT(HS256)를 `Authorization: Bearer <token>` 헤더로 전달한다.

servers:
  - url: http://localhost:3000/api
    description: Local
  - url: https://wp-final-projcet-be.onrender.com/api
    description: Render (production)

tags:
  - name: Health
  - name: Auth
  - name: Home
  - name: Issue
  - name: Admin
  - name: Cron

paths:
  /health:
    get:
      tags: [Health]
      summary: 프로세스 liveness
      responses:
        "200":
          description: up
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, example: up }
                          uptime: { type: number, example: 123.45 }

  /health/db:
    get:
      tags: [Health]
      summary: DB 연결 확인 (SELECT 1)
      responses:
        "200":
          description: DB up
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          db: { type: string, example: up }
        "503":
          description: DB 연결 실패
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/register:
    post:
      tags: [Auth]
      summary: 회원가입 (role 입력 무시 — 항상 'user')
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password]
              properties:
                email: { type: string, format: email, example: user@example.com }
                username: { type: string, example: alex_92, description: "3~20자 영문·숫자·_" }
                password: { type: string, format: password, example: abc12345, description: "최소 8자, 영문+숫자" }
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadInput" }
        "409":
          description: 이메일/유저네임 중복 (EMAIL_TAKEN / USERNAME_TAKEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인 (응답 body에 JWT token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          token: { type: string }
                          user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadInput" }
        "401":
          description: 자격 불일치 (INVALID_CREDENTIALS)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limit 초과 (15분당 5회)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/me:
    get:
      tags: [Auth]
      summary: 내 정보 조회
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 내 정보
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /home:
    get:
      tags: [Home]
      summary: 오늘 이슈 1건 + 과거 이슈 최근 10건 (published만)
      responses:
        "200":
          description: 홈 데이터
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          today_issue:
                            nullable: true
                            allOf: [{ $ref: "#/components/schemas/IssueCard" }]
                          past_issues:
                            type: array
                            items: { $ref: "#/components/schemas/IssueCard" }

  /issues/{id}:
    get:
      tags: [Issue]
      summary: 이슈(published) + 게시물 목록
      parameters:
        - $ref: "#/components/parameters/IssueId"
        - in: query
          name: sort
          schema: { type: string, enum: [top, latest], default: top }
      responses:
        "200":
          description: 이슈 + 게시물 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          issue: { $ref: "#/components/schemas/IssueCard" }
                          posts:
                            type: array
                            items: { $ref: "#/components/schemas/PostCard" }
        "400": { $ref: "#/components/responses/BadInput" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/issues:
    get:
      tags: [Admin]
      summary: 이슈 검수 목록 (관리자)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, published], default: pending }
      responses:
        "200":
          description: 이슈 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          issues:
                            type: array
                            items: { $ref: "#/components/schemas/Issue" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/issues/{id}:
    patch:
      tags: [Admin]
      summary: 이슈 승인 (pending → published)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IssueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [published] }
      responses:
        "200":
          description: 승인됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          id: { type: string, example: "130" }
                          status: { type: string, example: published }
                          published_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadInput" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 이미 게시됨 (ALREADY_PUBLISHED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Admin]
      summary: 이슈 거절 (pending hard delete)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IssueId"
      responses:
        "204": { description: 삭제됨 (body 없음) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cron/generate-issues:
    post:
      tags: [Cron]
      summary: "[internal] 오늘의 이슈 생성 (Gemini → pending). pg_cron이 호출."
      description: "Authorization 헤더에 CRON_SECRET을 Bearer로 전달. 일반 JWT 아님."
      security: [{ cronSecret: [] }]
      responses:
        "200":
          description: 생성/스킵
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          date: { type: string, example: "2026-06-07" }
                          status: { type: string, enum: [success, skipped] }
                          issue_id: { type: string, example: "131" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Gemini 호출/파싱 실패
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cronSecret:
      type: http
      scheme: bearer
      description: "CRON_SECRET (pg_cron 전용)"

  parameters:
    IssueId:
      in: path
      name: id
      required: true
      schema: { type: integer }
      description: Issue ID

  schemas:
    Success:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: object }
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: BAD_INPUT }
            message: { type: string }
            details: { type: array, items: { type: object } }
    User:
      type: object
      properties:
        id: { type: string, example: "42" }
        email: { type: string, example: user@example.com }
        username: { type: string, example: alex_92 }
        role: { type: string, enum: [user, admin], example: user }
        created_at: { type: string, format: date-time }
    Issue:
      type: object
      properties:
        id: { type: string, example: "130" }
        title: { type: string }
        summary: { type: string, nullable: true }
        source_url: { type: string, nullable: true }
        status: { type: string, enum: [pending, published] }
        published_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    IssueCard:
      type: object
      properties:
        id: { type: string, example: "100" }
        title: { type: string }
        summary: { type: string, nullable: true }
        source_url: { type: string, nullable: true, description: "today_issue에만 포함" }
        date: { type: string, example: "2026-06-07", description: "KST 날짜" }
        post_count: { type: integer, example: 12 }
        created_at: { type: string, format: date-time }
    PostCard:
      type: object
      properties:
        id: { type: string, example: "5021" }
        title: { type: string }
        body_preview: { type: string, description: "본문 첫 100자" }
        author:
          type: object
          properties:
            id: { type: string }
            username: { type: string }
        upvotes: { type: integer }
        downvotes: { type: integer }
        score: { type: integer }
        comment_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }

  responses:
    BadInput:
      description: 입력값 오류 (BAD_INPUT)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 인증 필요 (UNAUTHORIZED / INVALID_TOKEN)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 권한 없음 (FORBIDDEN — 관리자 전용)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 리소스 없음 (NOT_FOUND / ISSUE_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
