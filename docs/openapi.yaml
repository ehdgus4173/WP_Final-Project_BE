openapi: 3.0.3
info:
  title: What's Today — Backend API
  version: "1.0.0"
  description: >
    Backend API for a forum where users discuss the single daily current-affairs
    issue that AI selects and an admin reviews and publishes.
    All responses use a common envelope: success `{ success: true, data }`, failure `{ success: false, error: { code, message } }`.
    Authentication uses a JWT (HS256) passed in the `Authorization: Bearer <token>` header.

servers:
  - url: http://localhost:3000/api
    description: Local
  - url: https://wp-final-projcet-be.onrender.com/api
    description: Render (production)

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Home
  - name: Issue
  - name: Posts
  - name: Comments
  - name: Admin
  - name: Cron

paths:
  /health:
    get:
      tags: [Health]
      summary: Process liveness
      responses:
        "200":
          description: up
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, example: up }
                          uptime: { type: number, example: 123.45 }

  /health/db:
    get:
      tags: [Health]
      summary: DB connection check (SELECT 1)
      responses:
        "200":
          description: DB up
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          db: { type: string, example: up }
        "503":
          description: DB connection failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register (role input ignored — always 'user')
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password]
              properties:
                email: { type: string, format: email, example: user@example.com }
                username: { type: string, example: alex_92, description: "3-20 characters: letters, digits, or underscore" }
                password: { type: string, format: password, example: abc12345, description: "At least 8 characters, letters + digits" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadInput" }
        "409":
          description: Email/username already taken (EMAIL_TAKEN / USERNAME_TAKEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login (JWT token in the response body)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          token: { type: string }
                          user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadInput" }
        "401":
          description: Invalid credentials (INVALID_CREDENTIALS)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limit exceeded (5 per 15 minutes)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Auth]
      summary: Update current user (username / description)
      description: "Email and role cannot be changed. Both username and description are optional; only provided fields are updated."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string, example: alex_92, description: "3-20 characters: letters, digits, or underscore" }
                description: { type: string, maxLength: 500, example: "Hello!", description: "Self introduction (max 500 chars)" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadInput" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Username already taken (USERNAME_TAKEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/me/posts:
    get:
      tags: [Auth]
      summary: My recent posts (MyPage)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 3, minimum: 1, maximum: 20 }
          description: "Number of posts to fetch (default 3)"
      responses:
        "200":
          description: Recent posts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          posts:
                            type: array
                            items: { $ref: "#/components/schemas/UserPost" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/oauth:
    post:
      tags: [Auth]
      summary: Social login step 1 — identity verification (Google/GitHub)
      description: >
        Verifies the access_token obtained via Supabase OAuth (hybrid: identity via Supabase only, session token is our own JWT).
        For an existing account it issues our JWT; for a new account it returns `needs_username: true` (no account is created in this step).
        The email/name sent by the FE is not trusted; only verified token claims are used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_token]
              properties:
                access_token: { type: string, description: "Supabase OAuth access_token" }
      responses:
        "200":
          description: Existing account (token+user) or new account (needs_username)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        oneOf:
                          - type: object
                            properties:
                              token: { type: string }
                              user: { $ref: "#/components/schemas/User" }
                          - type: object
                            properties:
                              needs_username: { type: boolean, example: true }
        "400": { $ref: "#/components/responses/BadInput" }
        "401":
          description: Token verification failed (INVALID_OAUTH_TOKEN) or email not provided (OAUTH_EMAIL_REQUIRED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Social login not configured (OAUTH_NOT_CONFIGURED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/oauth/register:
    post:
      tags: [Auth]
      summary: Social login step 2 — complete sign-up after entering a username
      description: >
        A new user who received `needs_username` in step 1 picks a username to complete sign-up.
        After **re-verifying** the access_token (step 1 result / FE values are not trusted), it creates the account and issues our JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_token, username]
              properties:
                access_token: { type: string }
                username: { type: string, example: alex_92, description: "3-20 characters: letters, digits, or underscore" }
      responses:
        "200":
          description: Sign-up complete (token+user)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          token: { type: string }
                          user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadInput" }
        "401":
          description: Token verification failed (INVALID_OAUTH_TOKEN) or email not provided (OAUTH_EMAIL_REQUIRED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Username already taken (USERNAME_TAKEN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Social login not configured (OAUTH_NOT_CONFIGURED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users/{id}:
    get:
      tags: [Users]
      summary: Public profile (MyPage, read-only)
      description: "No authentication required. Anyone can view a user's profile."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: User ID
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{id}/posts:
    get:
      tags: [Users]
      summary: A user's recent posts
      description: "No authentication required."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: User ID
        - in: query
          name: limit
          schema: { type: integer, default: 3, minimum: 1, maximum: 20 }
          description: "Number of posts to fetch (default 3)"
      responses:
        "200":
          description: Recent posts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          posts:
                            type: array
                            items: { $ref: "#/components/schemas/UserPost" }

  /home:
    get:
      tags: [Home]
      summary: Today's issue + the 10 most recent past issues (published only)
      responses:
        "200":
          description: Home data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          today_issue:
                            nullable: true
                            allOf: [{ $ref: "#/components/schemas/IssueCard" }]
                          past_issues:
                            type: array
                            items: { $ref: "#/components/schemas/IssueCard" }

  /issues/{id}:
    get:
      tags: [Issue]
      summary: Issue (published) + post list
      parameters:
        - $ref: "#/components/parameters/IssueId"
        - in: query
          name: sort
          schema: { type: string, enum: [top, latest], default: top }
      responses:
        "200":
          description: Issue + post list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          issue: { $ref: "#/components/schemas/IssueCard" }
                          posts:
                            type: array
                            items: { $ref: "#/components/schemas/PostCard" }
        "400": { $ref: "#/components/responses/BadInput" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/issues:
    get:
      tags: [Admin]
      summary: Issue review list (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, published], default: pending }
      responses:
        "200":
          description: Issue list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          issues:
                            type: array
                            items: { $ref: "#/components/schemas/Issue" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/issues/{id}:
    patch:
      tags: [Admin]
      summary: Approve issue (pending → published)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IssueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [published] }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          id: { type: string, example: "130" }
                          status: { type: string, example: published }
                          published_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadInput" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already published (ALREADY_PUBLISHED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Admin]
      summary: Reject issue (pending hard delete)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IssueId"
      responses:
        "204": { description: Deleted (no body) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/regenerate-issues:
    post:
      tags: [Admin]
      summary: Manual issue generation (admin)
      description: >
        Manually generates today's issue using the same service as cron (the result is 'pending' — separate approval required).
        Since cron is CRON_SECRET-only and cannot be called from the FE, this provides a separate entry point protected by an admin JWT.
        Body is optional. `force:true` bypasses the dedup and generates a new issue even if today's already exists.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean, default: false }
      responses:
        "200":
          description: Generated / skipped
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          date: { type: string, example: "2026-06-08" }
                          status: { type: string, enum: [success, skipped] }
                          issue_id: { type: string, example: "131" }
        "400": { $ref: "#/components/responses/BadInput" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500":
          description: AI issue generation failed (GENERATION_FAILED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /cron/generate-issues:
    post:
      tags: [Cron]
      summary: "[internal] Generate today's issue (Gemini → pending). Called by pg_cron."
      description: "Pass CRON_SECRET as Bearer in the Authorization header. Not a regular JWT."
      security: [{ cronSecret: [] }]
      parameters:
        - in: query
          name: force
          schema: { type: boolean, default: false }
          description: "If true, bypass the dedup and generate a new issue even if today's exists (manual re-trigger)"
      responses:
        "200":
          description: Generated / skipped
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          date: { type: string, example: "2026-06-07" }
                          status: { type: string, enum: [success, skipped] }
                          issue_id: { type: string, example: "131" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Gemini call/parse failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /issues/{id}/posts:
    post:
      tags: [Posts]
      summary: Create post
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IssueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title: { type: string, maxLength: 120 }
                content: { type: string, minLength: 20, maxLength: 10000, description: Markdown source }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          id: { type: string, example: "5021" }
                          issue_id: { type: string, example: "100" }
                          title: { type: string }
                          created_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadInput" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /posts/{id}:
    get:
      tags: [Posts]
      summary: Post detail (body, score, user_vote + comments/replies)
      description: optionalAuth — when logged in, user_vote and each comment's liked_by_me are populated.
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Post detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          post: { $ref: "#/components/schemas/PostDetail" }
                          comments:
                            type: array
                            items: { $ref: "#/components/schemas/Comment" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Posts]
      summary: Edit post (author only — not even admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title: { type: string, maxLength: 120 }
                content: { type: string, minLength: 20, maxLength: 10000 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data:
                        type: object
                        properties:
                          id: { type: string }
                          title: { type: string }
                          updated_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadInput" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Posts]
      summary: Delete post (author or admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "204": { description: Deleted (no body) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /posts/{id}/votes:
    post:
      tags: [Posts]
      summary: Upvote/downvote toggle
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: integer, enum: [1, -1] }
      responses:
        "201":
          description: New vote (created)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data: { $ref: "#/components/schemas/VoteResult" }
        "200":
          description: Changed or cancelled (updated | deleted)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data: { $ref: "#/components/schemas/VoteResult" }
        "400": { $ref: "#/components/responses/BadInput" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /posts/{id}/comments:
    post:
      tags: [Comments]
      summary: Create comment/reply (reply if parent_id is present)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 2, maxLength: 1000 }
                parent_id: { type: integer, nullable: true, description: "If present, it's a reply (parent must be depth 0)" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data: { $ref: "#/components/schemas/Comment" }
        "400":
          description: Input error or replying to a reply (BAD_INPUT / CANNOT_REPLY_TO_REPLY)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Post/parent comment not found (POST_NOT_FOUND / PARENT_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /comments/{id}:
    delete:
      tags: [Comments]
      summary: Delete comment/reply (author or admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "204": { description: Deleted (no body) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /comments/{id}/likes:
    post:
      tags: [Comments]
      summary: Comment/reply like toggle
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "201":
          description: Like added (created)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data: { $ref: "#/components/schemas/LikeResult" }
        "200":
          description: Like removed (deleted)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      data: { $ref: "#/components/schemas/LikeResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cronSecret:
      type: http
      scheme: bearer
      description: "CRON_SECRET (pg_cron only)"

  parameters:
    IssueId:
      in: path
      name: id
      required: true
      schema: { type: integer }
      description: Issue ID
    PostId:
      in: path
      name: id
      required: true
      schema: { type: integer }
      description: Post ID
    CommentId:
      in: path
      name: id
      required: true
      schema: { type: integer }
      description: Comment ID

  schemas:
    Success:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: object }
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: BAD_INPUT }
            message: { type: string }
            details: { type: array, items: { type: object } }
    User:
      type: object
      properties:
        id: { type: string, example: "42" }
        email: { type: string, example: user@example.com }
        username: { type: string, example: alex_92 }
        description: { type: string, example: "Hi, I enjoy discussing current affairs.", description: "Self introduction (MyPage)" }
        role: { type: string, enum: [user, admin], example: user }
        created_at: { type: string, format: date-time }
    UserPost:
      type: object
      properties:
        id: { type: string, example: "5021" }
        issue_id: { type: string, example: "100" }
        title: { type: string }
        score: { type: integer, example: 7 }
        comment_count: { type: integer, example: 3 }
        created_at: { type: string, format: date-time }
    Issue:
      type: object
      properties:
        id: { type: string, example: "130" }
        title: { type: string }
        summary: { type: string, nullable: true }
        source_url: { type: string, nullable: true }
        status: { type: string, enum: [pending, published] }
        published_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    IssueCard:
      type: object
      properties:
        id: { type: string, example: "100" }
        title: { type: string }
        summary: { type: string, nullable: true }
        source_url: { type: string, nullable: true, description: "Included only in today_issue" }
        date: { type: string, example: "2026-06-07", description: "KST date" }
        post_count: { type: integer, example: 12 }
        created_at: { type: string, format: date-time }
    PostCard:
      type: object
      properties:
        id: { type: string, example: "5021" }
        title: { type: string }
        body_preview: { type: string, description: "First 100 characters of the body" }
        author:
          type: object
          properties:
            id: { type: string }
            username: { type: string }
        upvotes: { type: integer }
        downvotes: { type: integer }
        score: { type: integer }
        comment_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }
    Author:
      type: object
      properties:
        id: { type: string, example: "42" }
        username: { type: string, example: alex_92 }
    PostDetail:
      type: object
      properties:
        id: { type: string, example: "5021" }
        issue_id: { type: string, example: "100" }
        title: { type: string }
        content: { type: string, description: Markdown source }
        author: { $ref: "#/components/schemas/Author" }
        upvotes: { type: integer, example: 18 }
        downvotes: { type: integer, example: 2 }
        score: { type: integer, example: 16 }
        user_vote: { type: integer, enum: [1, -1], nullable: true, description: "Only when logged in; null otherwise" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }
    Comment:
      type: object
      properties:
        id: { type: string, example: "7011" }
        post_id: { type: string, example: "5021" }
        parent_id: { type: string, nullable: true, description: "null = comment, present = reply" }
        depth: { type: integer, enum: [0, 1], description: "0 = comment, 1 = reply" }
        content: { type: string }
        author: { $ref: "#/components/schemas/Author" }
        like_count: { type: integer, example: 12 }
        liked_by_me: { type: boolean, description: "Can be true only when logged in" }
        created_at: { type: string, format: date-time }
    VoteResult:
      type: object
      properties:
        post_id: { type: integer, example: 5021 }
        value: { type: integer, enum: [1, -1], nullable: true, description: "null when cancelled" }
        action: { type: string, enum: [created, updated, deleted] }
    LikeResult:
      type: object
      properties:
        comment_id: { type: integer, example: 7011 }
        liked: { type: boolean }
        like_count: { type: integer, example: 13 }
        action: { type: string, enum: [created, deleted] }

  responses:
    BadInput:
      description: Invalid input (BAD_INPUT)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Authentication required (UNAUTHORIZED / INVALID_TOKEN)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Forbidden (FORBIDDEN — admin only)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found (NOT_FOUND / ISSUE_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
